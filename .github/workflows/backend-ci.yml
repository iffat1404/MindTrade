name: Backend CI

on:
  push:
    branches: [main]
    paths: ["backend/**"]
  pull_request:
    branches: [main]
    paths: ["backend/**"]

jobs:
  lint-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: mindtrade_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://testuser:testpass@localhost:5432/mindtrade_test
      REDIS_URL: redis://localhost:6379
      ENVIRONMENT: test
      LOG_LEVEL: INFO
      SECRET_KEY: ci-test-secret-key
      ADMIN_BOOTSTRAP_USERNAME: admin_test
      ADMIN_BOOTSTRAP_PASSWORD: admin_test_password

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: cd backend && pip install -r requirements.txt

      - name: Lint
        run: cd backend && ruff check .

      - name: Run tests
        run: cd backend && pytest tests/ -v --tb=short
